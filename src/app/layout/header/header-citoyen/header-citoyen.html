<header class="page-header">
  <div class="header-left">
    <div class="titres">
      @if (user()) {
        <h1>
          <span class="greeting">Bonjour,</span>
          {{ user()?.nom }}
        </h1>
      }
      @if (titre) {
        <p class="sous-titre">{{ sousTitre }}</p>
      }
    </div>
  </div>

  <div class="header-right">
    <div class="actions">
      <button class="notif-btn" type="button" aria-label="Notifications">
        <i class="icon-bell"></i>
        @if (nbNotifications > 0) {
          <span class="badge">{{ nbNotifications }}</span>
        }
      </button>

      <div class="profile-wrapper">
        <a routerLink="/profil" class="profil-link">
          <div class="avatar">
            <i class="icon-user"></i>
          </div>
          <div class="profile-info">
            <span class="profile-name">{{ user()?.nom || 'Profil' }}</span>
            <span class="profile-role">Voir mon profil</span>
          </div>
          <i class="icon-chevron-down"></i>
        </a>
      </div>
    </div>
  </div>
</header>
