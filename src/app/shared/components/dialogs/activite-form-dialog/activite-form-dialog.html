<form [formGroup]="form" (ngSubmit)="inscrire()">

    <h1 mat-dialog-title>Créer une activité</h1>

    <mat-dialog-content>

        <mat-form-field appearance="outline">
            <mat-label>Nom</mat-label>
            <input matInput formControlName="nom">
            <mat-hint>Le nom doit avoir 3 caracteres</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Niveau</mat-label>
            <mat-select formControlName="niveau" placeholder="choississez un niveau">
                <mat-option value="DEBUTANT">
                    DEBUTANT
                </mat-option>
                <mat-option value="INTERMEDIAIRE">
                    INTERMEDIAIRE
                </mat-option>
                <mat-option value="AVANCE">
                    AVANCE
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Catégorie</mat-label>
            <mat-select formControlName="idCategorie" placeholder="choississez une categorie">
                @for (item of categories; track $index) {
                <mat-option [value]="item.id">
                    {{item.libelle}}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Durée</mat-label>
            <input matInput formControlName="duree" type="time">
        </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="submit"> Save</button>
    </mat-dialog-actions>

</form>
