<div class="container">
  <main class="conseils-list">
    @for (conseil of conseils(); track conseil.id) {
      <mat-card class="conseil-card" appearance="outlined">
        <mat-card-header>
          <div class="header-row">
            <mat-card-title>{{ conseil.titre }}</mat-card-title>
            <span class="source-badge">{{ conseil.typeConseil }}</span>
          </div>
        </mat-card-header>

        <mat-card-content>
          <p class="symptome-line">
            <mat-icon inline>sick</mat-icon>
            {{ conseil.contenu }}
          </p>

          <p class="conseil-preview">
            {{ conseil.categorieNom }}
          </p>
        </mat-card-content>

        <mat-card-footer class="card-footer">
          <span class="date">{{ conseil.dateCreation }}</span>
        </mat-card-footer>
      </mat-card>
    }
  </main>
</div>
