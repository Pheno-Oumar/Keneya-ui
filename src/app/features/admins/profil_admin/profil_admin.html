    <!-- Encadré avec la photo et le bouton Modifier -->

      <div class="user-info-header">
        <img src="assets/homme.avif" alt="Photo de profil" class="profile-avatar" />

    <!-- Section Informations personnelles -->
    <h3 class="section-title">Informations personnelles</h3>

    <div class="info-grid">

      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <div class="info-box">s123keitas</div>
      </div>

      <!-- Telephone -->
      <div class="form-group">
        <label>Telephone</label>
        <div class="info-box">+223 70000000</div>
      </div>

      <!-- Genre -->
      <div class="form-group">
        <label>Genre</label>
        <div class="info-box">Homme</div>

  </div>
</main>
