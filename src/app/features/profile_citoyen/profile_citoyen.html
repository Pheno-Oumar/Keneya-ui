<main class="profile-container">

  <div class="profile-content">
    <h1 class="page-title">Profil</h1>

    <div class="profile-card">
      <div class="user-info-header">
        <img src="assets/Femme.jpg" alt="Photo de profil" class="profile-avatar" />

        <div class="user-name-email">
          <h2>{{ profilForm.get('nom')?.value }} {{ profilForm.get('prenom')?.value }}</h2>
          <p>{{ profilForm.get('email')?.value }}</p>
        </div>
      </div>
    </div>

    <h3 class="section-title">Informations personnelles</h3>

    <!-- [formGroup] et (ngSubmit) ajoutés ici -->
    <form [formGroup]="profilForm" (ngSubmit)="onSubmit()">

      <div class="info-grid">

        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="nom" class="info-box">
        </div>

        <div class="form-group">
          <label>Prénom</label>
          <input type="text" formControlName="prenom" class="info-box">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="info-box">
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" formControlName="password" class="info-box">
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="text" formControlName="telephone" class="info-box">
        </div>

      </div>

      <button class="btn-edit-profile" type="submit">
        <mat-icon>save</mat-icon>
        Enregistrer les modifications
      </button>

    </form>

  </div>

</main>
