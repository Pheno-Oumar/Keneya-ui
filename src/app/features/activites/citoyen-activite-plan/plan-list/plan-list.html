<div class="dashboard-container">

  <main class="content">

    <div class="header">
      <div class="avatar">
        MT
      </div>
    </div>

    <div class="actions-bar">

      <mat-form-field appearance="outline" class="search-field">
        <input
          matInput
          placeholder="Rechercher...">

        <mat-icon matSuffix>
          search
        </mat-icon>
      </mat-form-field>

      <button
        mat-stroked-button
        class="filter-btn">

        <mat-icon>filter_list</mat-icon>
        Filtrer

      </button>

      <button
        mat-flat-button
        class="add-plan-btn"
        (click)="openAdd()">

        <mat-icon>add</mat-icon>
        Ajouter un plan

      </button>

    </div>

    @if (plans().length === 0) {

      <div class="empty-state">

        <mat-icon>event_busy</mat-icon>

        <h2>Aucun plan enregistré</h2>

        <p>Cliquez sur "Ajouter un plan" pour commencer.</p>

      </div>

    } @else {

      <div class="cards-container">

        @for (plan of plans(); track plan.idCitoyenActivitePlan) {

          <mat-card class="activity-card">

            <div
              class="card-content"
              (click)="openDetails(plan)">

              <div class="icon-container">

                <mat-icon color="primary">
                  directions_run
                </mat-icon>

              </div>

              <div class="text-info">

                <h2>{{ plan.nomActivite }}</h2>

                <p>{{ plan.plannings.length }} séance(s)</p>

              </div>

              <mat-icon>
                chevron_right
              </mat-icon>

            </div>

            <div class="card-actions">

              <button
                mat-icon-button
                color="primary"
                (click)="openEdit(plan); $event.stopPropagation()">

                <mat-icon>edit</mat-icon>

              </button>

              <button
                mat-icon-button
                color="warn"
                (click)="deletePlan(plan.idCitoyenActivitePlan!); $event.stopPropagation()">

                <mat-icon>delete</mat-icon>

              </button>

            </div>

          </mat-card>

        }

      </div>

    }

  </main>

</div>
