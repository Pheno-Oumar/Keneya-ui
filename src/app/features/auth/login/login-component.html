<div class="container">

    <div class="left">

        <img src="keneya-logo.png">

    </div>

    <div class="right">

        <mat-card>

            <img class="logo" src="keneya-logo.png">

            <h1>Connexion</h1>

            <p>Bienvenue ! Connectez-vous pour continuer.</p>

            <form [formGroup]="loginForm" (ngSubmit)="login()">

                <mat-form-field appearance="outline">

                    <mat-label>Email</mat-label>

                    <input
                    matInput
                    formControlName="email">

                </mat-form-field>

                <mat-form-field appearance="outline">

                    <mat-label>Mot de passe</mat-label>

                    <input
                    matInput
                    type="password"
                    formControlName="password">

                </mat-form-field>

                <a class="forgot">
                    Mot de passe oublié ?
                </a>

                <button
                mat-raised-button
                color="primary"
                class="btn">

                    Se connecter

                </button>

            </form>

            <p class="register">
                Pas de compte ?
                <a routerLink="/register">S'inscrire</a>
            </p>

        </mat-card>

    </div>

</div>
