<div class="modal-container">
  <div class="modal-header">
    <h1>Nouveau plan d'activités</h1>
    <mat-icon class="close-icon">close</mat-icon>
  </div>

  <div class="form-group">
    <label>choisissez une activité</label>
    <mat-form-field appearance="outline" class="full-width">
      <mat-select placeholder="Aucune activité sélectionnée">
        <mat-option value="run">Course à pieds</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="planning-section">
    <div class="section-header">
      <label>Plannings (jours et heures)</label>
      <button mat-flat-button class="btn-add-session">
        <mat-icon>add</mat-icon> Ajouter une séance
      </button>
    </div>

    <div class="empty-state">
      <div class="empty-icon-bg">
        <mat-icon>calendar_today</mat-icon>
      </div>
      <h3>Aucune séance ajouter</h3>
      <p>Ajoutez les jours et les heures où vous souhaitez pratiquez votre activité</p>
    </div>
  </div>

  <div class="modal-actions">
    <button mat-button class="btn-annuler">Annuler</button>
    <button mat-flat-button class="btn-enregistrer" disabled>
       <mat-icon>check</mat-icon> Enregistrer
    </button>
  </div>
</div>
