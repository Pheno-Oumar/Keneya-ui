<div class="modal-container">

    <div class="modal-header">

        <h2>

            {{data.nomActivite}}

        </h2>

        <button
            mat-icon-button
            (click)="close()">

            <mat-icon>

                close

            </mat-icon>

        </button>

    </div>

    <div class="modal-body">

        <h3>

            Plannings

        </h3>

        <div
            class="planning-card"
            *ngFor="let planning of data.plannings">

            <div class="planning-day">

                <mat-icon>

                    calendar_today

                </mat-icon>

                {{planning.jour}}

            </div>

            <div class="planning-hour">

                <mat-icon>

                    access_time

                </mat-icon>

                {{planning.heure}}

            </div>

        </div>

    </div>

    <div class="modal-footer">

        <button
            mat-button
            (click)="close()">

            Fermer

        </button>

        <button
            mat-flat-button
            color="primary"
            (click)="onEdit()">

            <mat-icon>

                edit

            </mat-icon>

            Modifier

        </button>

    </div>

</div>
