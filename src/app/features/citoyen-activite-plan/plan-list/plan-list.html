<div class="dashboard-container">
  
  <!-- 1. BARRE LATÉRALE (SIDEBAR) -->
  <aside class="sidebar">
    <div class="logo">
      <img src="assets/logo.png" alt="Logo">
    </div>
    
    <nav>
      <a mat-button><mat-icon>home</mat-icon> Tableau de board</a>
      <a mat-button><mat-icon>alarm</mat-icon> Rappels</a>
      <a mat-button class="active"><mat-icon>fitness_center</mat-icon> Activités physiques</a>
      <a mat-button><mat-icon>lightbulb</mat-icon> Conseils</a>
      <a mat-button><mat-icon>article</mat-icon> Publications</a>
      <a mat-button><mat-icon>bar_chart</mat-icon> Statistiques</a>
    </nav>

    <div class="logout">
      <button mat-button><mat-icon>logout</mat-icon> Deconnexion</button>
    </div>
  </aside>

  <!-- 2. CONTENU PRINCIPAL (MAIN CONTENT) -->
  <main class="content">
    
    <!-- Header avec l'avatar -->
    <div class="header">
      <div class="avatar">MT</div>
    </div>

    <!-- Barre de recherche et boutons -->
    <div class="actions-bar">
      <mat-form-field appearance="outline" class="search-field">
        <input matInput placeholder="Rechercher...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button mat-stroked-button class="filter-btn">
        <mat-icon>filter_list</mat-icon> Filtrer
      </button>

      <button mat-flat-button class="add-plan-btn" (click)="openAdd()">
        <mat-icon>add</mat-icon> Ajouter un plan
      </button>
    </div>

    <!-- Conteneur blanc qui contient la liste des cartes -->
    <div class="cards-container">
      
      <!-- Boucle sur les activités : C'est ici qu'on clique -->
      <mat-card class="activity-card" *ngFor="let activity of activities" (click)="openDetails(activity)">
        <div class="card-content">
          
          <!-- Icône à gauche -->
          <div class="icon-container" [style.color]="activity.color">
            <mat-icon class="activity-icon">{{activity.icon}}</mat-icon>
          </div>

          <!-- Texte au milieu -->
          <div class="text-info">
            <h2>{{activity.name}}</h2>
            <p>{{activity.sessions}} séances planifiées</p>
          </div>

          <!-- Flèche à droite -->
          <mat-icon class="chevron">chevron_right</mat-icon>
          
        </div>
      </mat-card>

    </div> <!-- Fin de cards-container -->

  </main> <!-- Fin de content -->

</div> <!-- Fin de dashboard-container -->
